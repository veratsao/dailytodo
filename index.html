<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學生作業進度追蹤管理系統</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --primary: #4f46e5;       /* 靛藍色系 - 主視覺 */
      --primary-hover: #4338ca;
      --danger: #ef4444;        /* 未繳 - 鮮紅 */
      --warning: #f59e0b;       /* 訂正 - 琥珀黃 */
      --success: #10b981;       /* 完成 - 翡翠綠 */
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius: 12px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -1px rgba(0,0,0,0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang TC", "Microsoft JhengHei", sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; }

    .no-print { display: block; }
    .print-only { display: none; }

    /* 頂部導覽列：強制依序排成單一橫行 */
    header { 
      display: flex;
      align-items: center; 
      background: var(--card-bg); 
      padding: 12px 20px; 
      border-radius: var(--radius); 
      box-shadow: var(--shadow-md); 
      margin-bottom: 20px; 
      border: 1px solid var(--border-color);
      overflow-x: auto;          /* 超出寬度時支援水平滾動 */
      white-space: nowrap;       /* 防止內部元素換行 */
    }

    .nav-header-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .nav-header-row button { 
      padding: 9px 16px; 
      border: 1px solid transparent; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: 600; 
      font-size: 0.9rem; 
      transition: all 0.2s ease; 
      background: #f1f5f9; 
      color: var(--text-muted); 
      flex-shrink: 0;          /* 保持按鈕原尺寸不被擠壓 */
    }
    
    .nav-header-row button:hover { background: #e2e8f0; color: var(--text-main); }
    .nav-header-row button.active { background-color: var(--primary); color: white; box-shadow: 0 2px 4px rgba(79, 70, 229, 0.3); }
    
    .nav-header-row button.btn-primary { background-color: var(--primary); color: white; }
    .nav-header-row button.btn-primary:hover { background-color: var(--primary-hover); }
    .nav-header-row button.btn-sync { background-color: #ecfdf5; color: #047857; border-color: #a7f3d0; }
    .nav-header-row button.btn-sync:hover { background-color: #d1fae5; }
    .nav-header-row button.btn-reset { background-color: #fef2f2; color: #dc2626; border-color: #fca5a5; }
    .nav-header-row button.btn-reset:hover { background-color: #fee2e2; }
    .nav-header-row button.btn-print { background-color: #f0f9ff; color: #0369a1; border-color: #bae6fd; }
    .nav-header-row button.btn-print:hover { background-color: #e0f2fe; }

    .nav-divider {
      width: 1px;
      height: 24px;
      background-color: var(--border-color);
      margin: 0 4px;
      flex-shrink: 0;
    }

    /* 頁面切換容器 */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* 每日作業狀態 - 看板卡片 */
    .task-board { display: flex; overflow-x: auto; gap: 18px; padding-bottom: 20px; align-items: flex-start; min-height: 200px; }
    .task-column { 
      background: var(--card-bg); width: 300px; min-width: 300px; border-radius: var(--radius); 
      box-shadow: var(--shadow-md); border: 1px solid var(--border-color); padding: 16px; position: relative; 
    }
    .task-header { margin-bottom: 14px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; padding-right: 28px; }
    .task-meta { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--text-muted); }
    .task-title-container { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 4px; }
    .task-title { font-size: 1.05rem; font-weight: 700; color: var(--text-main); line-height: 1.4; flex-grow: 1; word-break: break-all; }
    .btn-edit-title { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 0.9rem; padding: 2px 4px; border-radius: 4px; }
    .btn-edit-title:hover { color: var(--primary); background: #e0e7ff; }

    .task-category-tag { 
      font-size: 0.75rem; background: #e0e7ff; color: #3730a3; padding: 3px 8px; 
      border-radius: 20px; font-weight: 600; display: inline-block; 
    }
    .task-date-tag {
      font-size: 0.75rem; background: #f1f5f9; color: var(--text-muted); padding: 3px 8px;
      border-radius: 20px; font-weight: 500; display: inline-block;
    }
    
    .btn-delete-task { 
      position: absolute; top: 14px; right: 14px; background: none; border: none; 
      color: #94a3b8; font-size: 1.2rem; cursor: pointer; border-radius: 4px; transition: 0.2s; 
    }
    .btn-delete-task:hover { color: var(--danger); background: #fee2e2; }

    /* 學生方塊 (2 列網格 + 雙色圓角卡片) */
    .student-grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .student-block { 
      padding: 10px 8px; border-radius: 8px; color: white; font-weight: 600; font-size: 0.88rem; 
      display: flex; flex-direction: column; align-items: center; justify-content: center; 
      cursor: pointer; user-select: none; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
      box-shadow: var(--shadow-sm); text-align: center; 
    }
    .student-block:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.12); }
    .student-block:active { transform: translateY(0); }
    .student-block .status-sub { font-size: 0.72rem; font-weight: 500; opacity: 0.9; margin-top: 3px; }
    
    .status-unsubmitted { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .status-correcting { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .status-done { background: #f1f5f9; color: #94a3b8; box-shadow: none; }
    .status-done .status-sub { color: #cbd5e1; }

    .empty-state-box {
      width: 100%;
      background: var(--card-bg);
      border: 2px dashed var(--border-color);
      border-radius: var(--radius);
      padding: 40px;
      text-align: center;
      color: var(--text-muted);
    }

    /* 未完成統計與核銷 */
    .student-tags-bar { 
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; 
      background: var(--card-bg); padding: 14px; border-radius: var(--radius); 
      box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); 
    }
    .tag-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color); background: white; cursor: pointer; font-size: 0.88rem; color: var(--text-muted); transition: 0.2s; }
    .tag-btn:hover { background: #f8fafc; border-color: #cbd5e1; }
    .tag-btn.active { background: var(--primary); color: white; border-color: var(--primary); font-weight: 600; }

    .data-table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--card-bg); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); }
    .data-table th, .data-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border-color); }
    .data-table th { background-color: #f8fafb; font-weight: 600; color: var(--text-muted); font-size: 0.85rem; }
    .btn-verify { padding: 5px 12px; background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .btn-verify:hover { background: #d1fae5; }

    /* 列印設定頁面 */
    .print-selector { background: var(--card-bg); padding: 20px; border-radius: var(--radius); margin-bottom: 20px; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); }
    .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; margin: 16px 0; }
    .checkbox-grid label { display: flex; align-items: center; gap: 6px; font-size: 0.95rem; cursor: pointer; }

    /* A4 列印格式設定 (欠繳清單字體放大) */
    @media print {
      body { background: white; padding: 0; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      @page { size: A4 portrait; margin: 8mm; }

      .print-page { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8mm; width: 194mm; height: 275mm; page-break-after: always; }
      .print-card { border: 2px solid #000; padding: 10mm; box-sizing: border-box; height: 132mm; overflow: hidden; }
      .print-card h3 { border-bottom: 2px solid #000; padding-bottom: 6px; margin-bottom: 10px; font-size: 1.4rem; font-weight: bold; }
      .print-cat { font-weight: bold; background: #e5e7eb; padding: 4px 8px; font-size: 1.1rem; margin-top: 8px; border-radius: 4px; display: inline-block; }
      .print-list { list-style: square; padding-left: 24px; font-size: 1.05rem; margin-top: 6px; line-height: 1.5; }
      .print-list li { margin-bottom: 4px; }
      .status-tag-print { font-weight: bold; margin-left: 4px; }
    }

    /* Modal 彈出視窗質感設計 */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 24px; border-radius: 16px; width: 480px; max-width: 95%; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); border: 1px solid var(--border-color); }
    .modal-content h3 { font-size: 1.2rem; font-weight: 700; margin-bottom: 12px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.88rem; color: var(--text-main); }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.9rem; transition: 0.2s; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
    .modal-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    .modal-btns button { padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; border: 1px solid var(--border-color); background: #f8fafc; }
    
    .student-edit-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    .student-edit-table td { padding: 8px 4px; border-bottom: 1px solid var(--border-color); }
  </style>
</head>
<body>

  <!-- 頂部控制列（排成一整行） -->
  <header class="no-print">
    <div class="nav-header-row">
      <button class="active" onclick="switchTab('daily', this)">每日作業狀態</button>
      <button onclick="switchTab('cumulative', this)">未完成統計與核銷</button>
      <button onclick="switchTab('print', this)">列印欠繳清單</button>
      
      <div class="nav-divider"></div>
      
      <button onclick="openCategoryModal()">分類項目設定</button>
      <button onclick="openStudentModal()">管理學生名單</button>
      <button class="btn-primary" onclick="openTaskModal()">+ 新增作業欄位</button>
      <button class="btn-sync" onclick="syncCloud()">雲端同步 (GAS)</button>
      <button class="btn-reset" onclick="resetAllData()">一鍵重置資料</button>
    </div>
  </header>

  <!-- 1. 每日作業狀態 -->
  <main id="daily-view" class="tab-content active no-print">
    <div class="task-board" id="task-board"></div>
  </main>

  <!-- 2. 未完成統計與核銷 -->
  <main id="cumulative-view" class="tab-content no-print">
    <div class="student-tags-bar" id="student-tags"></div>
    <table class="data-table">
      <thead>
        <tr>
          <th>學生姓名</th>
          <th>作業日期</th>
          <th>科目分類</th>
          <th>作業名稱</th>
          <th>目前狀態</th>
          <th>核銷操作</th>
        </tr>
      </thead>
      <tbody id="cumulative-list"></tbody>
    </table>
  </main>

  <!-- 3. 列印設定頁面 -->
  <main id="print-view" class="tab-content no-print">
    <div class="print-selector">
      <h3>選擇欲列印欠繳清單的學生：</h3>
      <div style="margin-top: 10px;">
        <button onclick="selectAllPrint(true)" style="padding:4px 10px; border-radius:6px; cursor:pointer;">全選</button>
        <button onclick="selectAllPrint(false)" style="padding:4px 10px; border-radius:6px; cursor:pointer;">取消全選</button>
        <button class="btn-print" style="margin-left: 15px; padding:6px 14px; border-radius:6px; cursor:pointer; font-weight:600;" onclick="triggerPrint()">開啟 A4 預覽與列印</button>
      </div>
      <div class="checkbox-grid" id="print-checkboxes"></div>
    </div>
  </main>

  <!-- A4 列印區 -->
  <div class="print-only">
    <div class="print-page" id="print-container"></div>
  </div>

  <!-- 新增任務 Modal -->
  <div class="modal" id="task-modal">
    <div class="modal-content">
      <h3>新增作業任務</h3>
      <div class="form-group" style="margin-top:12px;">
        <label>作業日期：</label>
        <input type="date" id="task-date-input">
      </div>
      <div class="form-group">
        <label>選擇預設科目分類：</label>
        <select id="task-category-select"></select>
      </div>
      <div class="form-group">
        <label>輸入作業名稱：</label>
        <input type="text" id="task-name-input" placeholder="例如：習作 P.10-12">
      </div>
      <p style="font-size:0.8rem; color:var(--text-muted);">※ 新增後預設所有學生為「未完成(未繳)」狀態。</p>
      <div class="modal-btns">
        <button onclick="closeTaskModal()">取消</button>
        <button style="background:var(--primary); color:white; border:none;" onclick="saveNewTask()">確認新增</button>
      </div>
    </div>
  </div>

  <!-- 科目分類管理 Modal -->
  <div class="modal" id="category-modal">
    <div class="modal-content">
      <h3>科目分類項目設定</h3>
      <div class="form-group" style="margin-top:10px;">
        <label>新增科目分類：</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="new-category-input" placeholder="例如：本土語、藝術">
          <button style="padding:6px 12px; background:var(--primary); color:white; border:none; border-radius:8px; cursor:pointer;" onclick="addCategory()">新增</button>
        </div>
      </div>
      <hr style="margin: 15px 0; border:0; border-top:1px solid var(--border-color);">
      <h4>現有分類項目：</h4>
      <div id="category-list" style="margin-top:10px;"></div>
      <div class="modal-btns">
        <button onclick="closeCategoryModal()">完成</button>
      </div>
    </div>
  </div>

  <!-- 學生管理 Modal -->
  <div class="modal" id="student-modal">
    <div class="modal-content">
      <h3>學生名單管理</h3>
      <div class="form-group" style="margin-top:10px;">
        <label>批量新增學生（每行一位）：</label>
        <textarea id="batch-student-input" style="height:65px;" placeholder="張小明&#10;李小華"></textarea>
        <button style="margin-top:6px; padding:6px 12px; background:#f1f5f9; border:1px solid var(--border-color); border-radius:6px; cursor:pointer;" onclick="saveBatchStudents()">批量加入名單</button>
      </div>
      <hr style="margin: 15px 0; border:0; border-top:1px solid var(--border-color);">
      <h4>現有名單 (已按筆畫排序)：</h4>
      <table class="student-edit-table">
        <tbody id="student-edit-list"></tbody>
      </table>
      <div class="modal-btns">
        <button onclick="closeStudentModal()">關閉</button>
      </div>
    </div>
  </main>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzPne0zJciyGcaaaUsb2QYsyvxyaJEBUQpCzqNX4hvXL6rMtjEijtFGSY8DaSV4_BmqvA/exec";

    // 取得當前日期格式 YYYY-MM-DD
    function getTodayString() {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    // 初始預設範例資料
    const defaultState = {
      categories: ["國語", "數學", "英文", "社會", "自然", "綜合"],
      students: ["張小明", "李小華", "王大同", "陳美麗", "林阿強"],
      tasks: [
        { id: 1, date: getTodayString(), category: "國語", name: "國語習作 L3" },
        { id: 2, date: getTodayString(), category: "數學", name: "數學習作 P.15" }
      ],
      records: {
        "張小明_1": "unsubmitted",
        "張小明_2": "correcting",
        "李小華_1": "unsubmitted"
      }
    };

    let state = JSON.parse(JSON.stringify(defaultState));
    let selectedStudentFilter = 'ALL';

    function init() {
      const saved = localStorage.getItem("tracker_data_v4");
      if (saved) {
        try {
          state = JSON.parse(saved);
        } catch (e) {
          state = JSON.parse(JSON.stringify(defaultState));
        }
      }
      sortStudentsByStroke();
      renderDailyBoard();
      renderStudentTags();
      renderCumulative();
      renderPrintCheckboxes();
    }

    function saveData() {
      sortStudentsByStroke();
      localStorage.setItem("tracker_data_v4", JSON.stringify(state));
      if (!GAS_WEB_APP_URL.includes("YOUR_GOOGLE")) {
        fetch(GAS_WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(state) });
      }
    }

    function sortStudentsByStroke() {
      if (state.students && state.students.length > 0) {
        state.students.sort((a, b) => a.localeCompare(b, 'zh-Hant'));
      }
    }

    /* 一鍵重置資料 */
    function resetAllData() {
      const confirmFirst = confirm("警告：您確定要重置系統資料嗎？\n這將會【完全清空】所有任務、學生名單與紀錄，方便新班級使用。");
      if (confirmFirst) {
        const confirmSecond = confirm("請再次確認：所有學生與任務資料將被完全刪除且無法復原！是否繼續？");
        if (confirmSecond) {
          state = {
            categories: state.categories && state.categories.length > 0 ? state.categories : ["國語", "數學", "英文", "社會", "自然", "綜合"],
            students: [],
            tasks: [],
            records: {}
          };
          saveData();
          init();
          alert("所有任務與學生名單已成功清空！請點擊「管理學生名單」與「+ 新增作業欄位」開始建置新班級資料。");
        }
      }
    }

    function switchTab(tab, btnElem) {
      document.querySelectorAll('.nav-header-row button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      if(btnElem) btnElem.classList.add('active');
      
      if (tab === 'daily') {
        document.getElementById('daily-view').classList.add('active');
        renderDailyBoard();
      } else if (tab === 'cumulative') {
        document.getElementById('cumulative-view').classList.add('active');
        renderStudentTags();
        renderCumulative();
      } else if (tab === 'print') {
        document.getElementById('print-view').classList.add('active');
        renderPrintCheckboxes();
      }
    }

    // 1. 每日看板渲染（只顯示「當天日期」的作業內容）
    function renderDailyBoard() {
      const board = document.getElementById('task-board');
      board.innerHTML = '';

      const todayStr = getTodayString();
      // 只篩選出作業日期等於今天的任務
      const todayTasks = state.tasks.filter(t => t.date === todayStr);

      if (todayTasks.length === 0) {
        board.innerHTML = `
          <div class="empty-state-box">
            <h3>今日 (${todayStr}) 尚無作業任務</h3>
            <p style="margin-top:8px;">請點擊上方「+ 新增作業欄位」建立今日作業。<br>過往未完成的作業可至「未完成統計與核銷」或「列印欠繳清單」查看與核銷。</p>
          </div>`;
        return;
      }

      todayTasks.forEach(task => {
        let colHtml = `
          <div class="task-column">
            <button class="btn-delete-task" title="刪除此任務" onclick="deleteTask(${task.id})">&times;</button>
            <div class="task-header">
              <div class="task-meta">
                <span class="task-category-tag">${task.category}</span>
                <span class="task-date-tag">📅 ${task.date}</span>
              </div>
              <div class="task-title-container">
                <div class="task-title" id="task-title-${task.id}">${task.name}</div>
                <button class="btn-edit-title" title="修改作業名稱" onclick="editTaskName(${task.id})">✏️</button>
              </div>
            </div>
            <div class="student-grid-2col">`;

        if (state.students.length === 0) {
          colHtml += `<div style="grid-column: span 2; text-align:center; color:var(--text-muted); padding:10px; font-size:0.85rem;">尚未建立學生名單</div>`;
        } else {
          state.students.forEach(student => {
            const key = `${student}_${task.id}`;
            const status = state.records[key] || 'unsubmitted';
            
            let statusClass = 'status-unsubmitted';
            let statusText = '未繳';
            if (status === 'correcting') { statusClass = 'status-correcting'; statusText = '訂正'; }
            else if (status === 'done') { statusClass = 'status-done'; statusText = '完成'; }

            colHtml += `
              <div class="student-block ${statusClass}" onclick="cycleStatus('${student}', ${task.id})">
                <span>${student}</span>
                <span class="status-sub">${statusText}</span>
              </div>`;
          });
        }

        colHtml += `</div></div>`;
        board.innerHTML += colHtml;
      });
    }

    /* 修改任務名稱功能 */
    function editTaskName(taskId) {
      const task = state.tasks.find(t => t.id === taskId);
      if (!task) return;
      
      const newName = prompt("請輸入新的作業名稱：", task.name);
      if (newName !== null) {
        const trimmed = newName.trim();
        if (trimmed) {
          task.name = trimmed;
          saveData();
          renderDailyBoard();
        } else {
          alert("作業名稱不能為空！");
        }
      }
    }

    function cycleStatus(student, taskId) {
      const key = `${student}_${taskId}`;
      const current = state.records[key] || 'unsubmitted';
      
      if (current === 'unsubmitted') state.records[key] = 'correcting';
      else if (current === 'correcting') state.records[key] = 'done';
      else if (current === 'done') state.records[key] = 'unsubmitted';

      saveData();
      renderDailyBoard();
    }

    // 科目分類管理 Modal 邏輯
    function openCategoryModal() {
      renderCategoryList();
      document.getElementById('category-modal').style.display = 'flex';
    }

    function closeCategoryModal() {
      document.getElementById('category-modal').style.display = 'none';
    }

    function renderCategoryList() {
      const list = document.getElementById('category-list');
      list.innerHTML = '';
      state.categories.forEach((cat, index) => {
        list.innerHTML += `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <input type="text" value="${cat}" style="width:70%; padding:6px;" onchange="updateCategory(${index}, this.value)">
            <button style="color:var(--danger); border:none; background:none; cursor:pointer;" onclick="deleteCategory(${index})">刪除</button>
          </div>`;
      });
    }

    function addCategory() {
      const input = document.getElementById('new-category-input');
      const val = input.value.trim();
      if (val && !state.categories.includes(val)) {
        state.categories.push(val);
        input.value = '';
        saveData();
        renderCategoryList();
      }
    }

    function updateCategory(index, newVal) {
      newVal = newVal.trim();
      if (newVal) {
        state.categories[index] = newVal;
        saveData();
      }
    }

    function deleteCategory(index) {
      if (confirm(`確定要刪除「${state.categories[index]}」分類嗎？`)) {
        state.categories.splice(index, 1);
        saveData();
        renderCategoryList();
      }
    }

    // 新增任務 (帶入預設今日日期)
    function openTaskModal() {
      if (!state.categories || state.categories.length === 0) {
        alert("請先至少建立一個科目分類！");
        openCategoryModal();
        return;
      }
      
      // 自動設為當日日期
      document.getElementById('task-date-input').value = getTodayString();

      const select = document.getElementById('task-category-select');
      select.innerHTML = '';
      state.categories.forEach(cat => {
        select.innerHTML += `<option value="${cat}">${cat}</option>`;
      });
      document.getElementById('task-name-input').value = '';
      document.getElementById('task-modal').style.display = 'flex';
    }

    function closeTaskModal() {
      document.getElementById('task-modal').style.display = 'none';
    }

    function saveNewTask() {
      const date = document.getElementById('task-date-input').value || getTodayString();
      const category = document.getElementById('task-category-select').value;
      const name = document.getElementById('task-name-input').value.trim();
      if (!name) return alert("請輸入作業名稱！");

      const newTaskId = Date.now();
      state.tasks.push({ id: newTaskId, date, category, name });

      state.students.forEach(student => {
        state.records[`${student}_${newTaskId}`] = 'unsubmitted';
      });

      saveData();
      closeTaskModal();
      renderDailyBoard();
    }

    function deleteTask(taskId) {
      if (confirm("確定要刪除這個任務欄位嗎？")) {
        state.tasks = state.tasks.filter(t => t.id !== taskId);
        for (let key in state.records) {
          if (key.endsWith(`_${taskId}`)) delete state.records[key];
        }
        saveData();
        renderDailyBoard();
      }
    }

    // 2. 累計核銷 (會包含所有歷史日期的未完成項目)
    function renderStudentTags() {
      const container = document.getElementById('student-tags');
      container.innerHTML = `<button class="tag-btn ${selectedStudentFilter==='ALL'?'active':''}" onclick="filterByStudent('ALL')">全部學生</button>`;
      state.students.forEach(student => {
        const active = selectedStudentFilter === student ? 'active' : '';
        container.innerHTML += `<button class="tag-btn ${active}" onclick="filterByStudent('${student}')">${student}</button>`;
      });
    }

    function filterByStudent(student) {
      selectedStudentFilter = student;
      renderStudentTags();
      renderCumulative();
    }

    function renderCumulative() {
      const list = document.getElementById('cumulative-list');
      list.innerHTML = '';

      if (state.students.length === 0 || state.tasks.length === 0) {
        list.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--text-muted); padding:20px;">尚無學生或任務資料</td></tr>`;
        return;
      }

      state.students.forEach(student => {
        if (selectedStudentFilter !== 'ALL' && selectedStudentFilter !== student) return;

        state.tasks.forEach(task => {
          const key = `${student}_${task.id}`;
          const status = state.records[key] || 'unsubmitted';

          if (status === 'unsubmitted' || status === 'correcting') {
            const statusText = status === 'unsubmitted' ? '<span style="color:var(--danger);font-weight:600;">未繳</span>' : '<span style="color:var(--warning);font-weight:600;">訂正</span>';
            list.innerHTML += `
              <tr>
                <td><b>${student}</b></td>
                <td>${task.date || '-'}</td>
                <td>${task.category}</td>
                <td>${task.name}</td>
                <td>${statusText}</td>
                <td><button class="btn-verify" onclick="verifyTask('${student}', ${task.id})">核銷(完成)</button></td>
              </tr>`;
          }
        });
      });
    }

    function verifyTask(student, taskId) {
      state.records[`${student}_${taskId}`] = 'done';
      saveData();
      renderCumulative();
    }

    // 3. 列印功能 (會包含所有歷史日期的未完成項目，且字體已放大設計)
    function renderPrintCheckboxes() {
      const container = document.getElementById('print-checkboxes');
      container.innerHTML = '';
      if (state.students.length === 0) {
        container.innerHTML = `<p style="color:var(--text-muted);">尚無學生名單可供選擇。</p>`;
        return;
      }
      state.students.forEach(student => {
        container.innerHTML += `<label><input type="checkbox" class="print-chk" value="${student}" checked> ${student}</label>`;
      });
    }

    function selectAllPrint(select) {
      document.querySelectorAll('.print-chk').forEach(chk => chk.checked = select);
    }

    function triggerPrint() {
      const selectedStudents = Array.from(document.querySelectorAll('.print-chk:checked')).map(cb => cb.value);
      if (selectedStudents.length === 0) return alert("請至少選取一位學生！");

      const printContainer = document.getElementById('print-container');
      printContainer.innerHTML = '';

      for (let i = 0; i < selectedStudents.length; i += 4) {
        const pageStudents = selectedStudents.slice(i, i + 4);
        let pageHtml = `<div class="print-page">`;

        pageStudents.forEach(student => {
          pageHtml += `<div class="print-card"><h3>${student} - 欠繳與訂正清單</h3>`;
          const catMap = {};
          state.tasks.forEach(task => {
            const status = state.records[`${student}_${task.id}`] || 'unsubmitted';
            if (status === 'unsubmitted' || status === 'correcting') {
              if (!catMap[task.category]) catMap[task.category] = [];
              catMap[task.category].push({ name: task.name, date: task.date, status });
            }
          });

          if (Object.keys(catMap).length === 0) {
            pageHtml += `<p style="margin-top:15px; color:green; font-size:1.2rem; font-weight:bold;">目前作業全數完成！</p>`;
          } else {
            for (let cat in catMap) {
              pageHtml += `<div class="print-cat">${cat}</div><ul class="print-list">`;
              catMap[cat].forEach(item => {
                const tag = item.status === 'unsubmitted' ? '<span class="status-tag-print" style="color:#dc2626;">(未繳)</span>' : '<span class="status-tag-print" style="color:#d97706;">(訂正)</span>';
                const dateStr = item.date ? `[${item.date}] ` : '';
                pageHtml += `<li>${dateStr}${item.name} ${tag}</li>`;
              });
              pageHtml += `</ul>`;
            }
          }
          pageHtml += `</div>`;
        });

        pageHtml += `</div>`;
        printContainer.innerHTML += pageHtml;
      }
      window.print();
    }

    // 學生名單管理
    function openStudentModal() {
      renderStudentEditList();
      document.getElementById('student-modal').style.display = 'flex';
    }

    function closeStudentModal() {
      document.getElementById('student-modal').style.display = 'none';
      renderDailyBoard();
    }

    function saveBatchStudents() {
      const raw = document.getElementById('batch-student-input').value;
      if (!raw.trim()) return;
      
      const newNames = raw.split(/[\n,，]/).map(s => s.trim()).filter(s => s.length > 0);
      newNames.forEach(name => {
        if (!state.students.includes(name)) state.students.push(name);
      });

      document.getElementById('batch-student-input').value = '';
      saveData();
      renderStudentEditList();
    }

    function renderStudentEditList() {
      const tbody = document.getElementById('student-edit-list');
      tbody.innerHTML = '';
      if (state.students.length === 0) {
        tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; color:var(--text-muted); padding:10px;">目前無學生名單</td></tr>`;
        return;
      }
      state.students.forEach((student, index) => {
        tbody.innerHTML += `
          <tr>
            <td><input type="text" value="${student}" style="padding:6px; border-radius:6px; border:1px solid var(--border-color); width:90%;" onchange="updateStudentName(${index}, this.value)"></td>
            <td style="width:50px; text-align:right;"><button style="color:var(--danger); border:none; background:none; cursor:pointer;" onclick="deleteStudent(${index})">刪除</button></td>
          </tr>`;
      });
    }

    function updateStudentName(index, newName) {
      newName = newName.trim();
      const oldName = state.students[index];
      if (!newName || newName === oldName) return;

      state.students[index] = newName;
      for (let key in state.records) {
        if (key.startsWith(`${oldName}_`)) {
          const taskId = key.split('_')[1];
          state.records[`${newName}_${taskId}`] = state.records[key];
          delete state.records[key];
        }
      }
      saveData();
      renderStudentEditList();
    }

    function deleteStudent(index) {
      if (confirm(`確定刪除「${state.students[index]}」嗎？`)) {
        state.students.splice(index, 1);
        saveData();
        renderStudentEditList();
      }
    }

    function syncCloud() {
      if (GAS_WEB_APP_URL.includes("YOUR_GOOGLE")) return alert("請先將程式碼中的 GAS_WEB_APP_URL 替換為你的 Web App URL！");
      fetch(GAS_WEB_APP_URL)
        .then(res => res.json())
        .then(remote => {
          state = remote;
          saveData();
          init();
          alert("雲端資料同步完成！");
        });
    }

    init();
  </script>
</body>
</html>
