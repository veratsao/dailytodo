<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學生作業進度追蹤管理系統</title>
  <style>
    :root {
      --bg-color: #f4f8fa;
      --card-bg: #ffffff;
      
      /* 色彩主題 */
      --color-primary: #067BC2;     /* 主視覺蔚藍 */
      --color-secondary: #84BCDA;   /* 次要天空藍 */
      --color-yellow: #FFD6C0;      /* 訂正粉蜜桃色（純色） */
      --color-orange: #F37748;      /* 未繳珊瑚橙 */
      --color-red: #D56062;         /* 刪除/重置珊瑚紅 */
      
      --text-main: #1c2d37;
      --text-muted: #5a7384;
      --border-color: #d1e3ed;
      --radius: 12px;
      --shadow-sm: 0 1px 3px rgba(6, 123, 194, 0.08);
      --shadow-md: 0 4px 10px rgba(6, 123, 194, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang TC", "Microsoft JhengHei", sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 12px; }

    .no-print { display: block; }
    .print-only { display: none; }

    /* 頂部導覽列 */
    header { 
      display: flex;
      align-items: center; 
      background: var(--card-bg); 
      padding: 8px 14px; 
      border-radius: var(--radius); 
      box-shadow: var(--shadow-md); 
      margin-bottom: 12px; 
      border: 1px solid var(--border-color);
      overflow-x: auto;
      white-space: nowrap;
    }

    .nav-header-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .nav-header-row button { 
      padding: 7px 12px; 
      border: 1px solid transparent; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: 600; 
      font-size: 0.85rem; 
      transition: all 0.2s ease; 
      background: #eef5f9; 
      color: var(--text-muted); 
      flex-shrink: 0;
    }
    
    .nav-header-row button:hover { background: #e0edf4; color: var(--text-main); }
    .nav-header-row button.active { background-color: var(--color-primary); color: white; box-shadow: 0 2px 5px rgba(6, 123, 194, 0.3); }
    
    .nav-header-row button.btn-primary { background-color: var(--color-primary); color: white; }
    .nav-header-row button.btn-primary:hover { background-color: #0569a6; }
    .nav-header-row button.btn-sync { background-color: #eef8fc; color: var(--color-primary); border-color: var(--color-secondary); }
    .nav-header-row button.btn-sync:hover { background-color: #d8edf6; }
    .nav-header-row button.btn-reset { background-color: #fdf2f2; color: var(--color-red); border-color: #f5babb; }
    .nav-header-row button.btn-reset:hover { background-color: #fbe5e6; }
    .nav-header-row button.btn-print { background-color: #fefcf3; color: #b08f00; border-color: #f7e692; }
    .nav-header-row button.btn-print:hover { background-color: #fdf6d5; }

    .nav-divider {
      width: 1px;
      height: 20px;
      background-color: var(--border-color);
      margin: 0 2px;
      flex-shrink: 0;
    }

    /* 頁面切換容器 */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* 平板橫向看板：設定 flex-start 避免單一任務被拉寬 */
    .task-board { 
      display: flex; 
      gap: 12px; 
      align-items: flex-start; 
      justify-content: flex-start;
      height: calc(100vh - 80px);
      width: 100%;
      overflow-x: auto;
    }

    /* 任務欄位：固定寬度範圍，不隨數量少而膨脹 */
    .task-column { 
      background: var(--card-bg); 
      width: 320px;
      min-width: 280px;
      max-width: 320px;
      flex-shrink: 0;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      border-radius: var(--radius); 
      box-shadow: var(--shadow-md); 
      border: 1px solid var(--border-color); 
      padding: 10px; 
      position: relative; 
    }

    .task-header { margin-bottom: 6px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; padding-right: 20px; flex-shrink: 0; }
    .task-meta { display: flex; align-items: center; gap: 4px; font-size: 0.7rem; color: var(--text-muted); flex-wrap: wrap; }
    .task-title-container { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin-top: 2px; }
    .task-title { font-size: 0.9rem; font-weight: 700; color: var(--text-main); line-height: 1.2; flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-edit-title { background: none; border: none; color: var(--color-secondary); cursor: pointer; font-size: 0.8rem; padding: 1px 3px; border-radius: 4px; }
    .btn-edit-title:hover { color: var(--color-primary); background: #eef8fc; }

    .task-category-tag { 
      font-size: 0.68rem; background: #e6f2f9; color: var(--color-primary); padding: 1px 6px; 
      border-radius: 10px; font-weight: 600; display: inline-block; 
    }
    .task-target-tag { 
      font-size: 0.68rem; background: #fdf8e1; color: #8f7400; padding: 1px 6px; 
      border-radius: 10px; font-weight: 600; display: inline-block; border: 1px solid #f7ea9b;
    }
    .task-date-tag {
      font-size: 0.68rem; background: #eef5f9; color: var(--text-muted); padding: 1px 6px;
      border-radius: 10px; font-weight: 500; display: inline-block;
    }
    
    .btn-delete-task { 
      position: absolute; top: 8px; right: 8px; background: none; border: none; 
      color: #b0c4d1; font-size: 1rem; cursor: pointer; border-radius: 4px; transition: 0.2s; 
    }
    .btn-delete-task:hover { color: var(--color-red); background: #fdf2f2; }

    /* 2 欄網格學生方塊 */
    .student-grid-2col { 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 6px; 
      overflow-y: auto; 
      padding-right: 2px;
    }

    .student-block { 
      padding: 6px 8px; 
      border-radius: 6px; 
      color: white; 
      font-weight: 600; 
      font-size: 0.82rem; 
      display: flex; 
      flex-direction: row; 
      align-items: center; 
      justify-content: space-between; 
      cursor: pointer; 
      user-select: none; 
      transition: all 0.15s ease; 
      box-shadow: var(--shadow-sm); 
      text-align: left; 
    }

    .student-block:hover { transform: scale(1.02); }
    .student-block:active { transform: scale(0.98); }
    .student-block .student-name-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-grow: 1; letter-spacing: -0.3px; }
    .student-block .status-sub { font-size: 0.7rem; font-weight: 700; opacity: 0.95; margin-left: 4px; flex-shrink: 0; background: rgba(0,0,0,0.12); padding: 1px 4px; border-radius: 3px; }
    
    /* 未繳：#F37748（純色） */
    .status-unsubmitted { background-color: #F37748; }
    /* 訂正：#FFD6C0（純色無漸層，搭配深色文字） */
    .status-correcting { background-color: #FFD6C0; color: #5a2e19; }
    .status-correcting .status-sub { background: rgba(0,0,0,0.08); color: #5a2e19; }
    /* 完成：輕量白灰色調 */
    .status-done { background-color: #eef5f9; color: #7f9ab0; box-shadow: none; border: 1px solid var(--border-color); }
    .status-done .status-sub { color: #7f9ab0; background: #dce7ee; }
    
    /* 免繳/非指定對象樣式 */
    .status-na { background-color: #f8fafc; color: #cbd5e1; border: 1px dashed #e2e8f0; box-shadow: none; cursor: not-allowed; }
    .status-na .status-sub { color: #cbd5e1; background: transparent; }

    .empty-state-box {
      width: 100%;
      background: var(--card-bg);
      border: 2px dashed var(--border-color);
      border-radius: var(--radius);
      padding: 30px;
      text-align: center;
      color: var(--text-muted);
    }

    /* 未完成統計與核銷控制區域 */
    .cumulative-controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
      background: var(--card-bg);
      padding: 16px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
    }

    .cumulative-filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-group label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .filter-group select {
      padding: 6px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .student-tags-bar { 
      display: flex; gap: 8px; flex-wrap: wrap;
    }

    .tag-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color); background: white; cursor: pointer; font-size: 0.88rem; color: var(--text-muted); transition: 0.2s; }
    .tag-btn:hover { background: #f8fafc; border-color: #cbd5e1; }
    .tag-btn.active { background: var(--color-primary); color: white; border-color: var(--color-primary); font-weight: 600; }

    .data-table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--card-bg); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); }
    .data-table th, .data-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border-color); }
    .data-table th { background-color: #f4f8fa; font-weight: 600; color: var(--text-muted); font-size: 0.85rem; }
    
    .btn-action-group { display: flex; gap: 6px; }
    .btn-correct { padding: 5px 12px; background: #FFD6C0; color: #5a2e19; border: 1px solid #f2bda2; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .btn-correct:hover { background: #fcc2a3; }
    .btn-verify { padding: 5px 12px; background: #eef8fc; color: var(--color-primary); border: 1px solid var(--color-secondary); border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .btn-verify:hover { background: #d8edf6; }
    .btn-revert-unsub { padding: 5px 12px; background: #fdf2f2; color: var(--color-red); border: 1px solid #f5babb; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .btn-revert-unsub:hover { background: #fbe5e6; }

    /* 列印設定頁面 */
    .print-selector { background: var(--card-bg); padding: 20px; border-radius: var(--radius); margin-bottom: 20px; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); }
    .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; margin: 16px 0; }
    .checkbox-grid label { display: flex; align-items: center; gap: 6px; font-size: 0.95rem; cursor: pointer; }

    /* A4 列印格式：每頁 4 個卡片滿版 */
    @media print {
      html, body {
        width: 210mm;
        background: white;
        padding: 0 !important;
        margin: 0 !important;
      }
      
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      
      @page { 
        size: A4 portrait; 
        margin: 5mm; 
      }

      .print-page { 
        display: grid !important; 
        grid-template-columns: 1fr 1fr !important; 
        grid-template-rows: 1fr 1fr !important; 
        gap: 5mm !important; 
        width: 200mm !important; 
        height: 285mm !important; 
        box-sizing: border-box !important;
        page-break-after: always !important;
        break-after: page !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        overflow: hidden !important;
      }

      .print-card { 
        border: 2px solid #000; 
        padding: 6mm 8mm; 
        box-sizing: border-box; 
        height: 138mm !important; 
        overflow: hidden; 
        display: flex;
        flex-direction: column;
      }

      .print-card h3 { border-bottom: 2px solid #000; padding-bottom: 6px; margin-bottom: 8px; font-size: 1.3rem; font-weight: bold; }
      .print-cat { font-weight: bold; background: #e5e7eb; padding: 2px 6px; font-size: 1rem; margin-top: 5px; border-radius: 4px; display: inline-block; }
      .print-list { list-style: square; padding-left: 20px; font-size: 0.95rem; margin-top: 3px; line-height: 1.35; }
      .print-list li { margin-bottom: 2px; }
      .status-tag-print { font-weight: bold; margin-left: 4px; }
    }

    /* Modal 彈出視窗 */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(28, 45, 55, 0.4); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 24px; border-radius: 16px; width: 560px; max-width: 95%; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); border: 1px solid var(--border-color); }
    .modal-content h3 { font-size: 1.2rem; font-weight: 700; margin-bottom: 12px; color: var(--color-primary); }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.88rem; color: var(--text-main); }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.9rem; transition: 0.2s; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(6, 123, 194, 0.15); }
    .modal-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    .modal-btns button { padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; border: 1px solid var(--border-color); background: #f8fafc; }
    
    .student-edit-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    .student-edit-table th { font-size:0.8rem; text-align:left; padding:6px; color:var(--text-muted); background:#f4f8fa; }
    .student-edit-table td { padding: 8px 4px; border-bottom: 1px solid var(--border-color); }
  </style>
</head>
<body>

  <!-- 頂部列 -->
  <header class="no-print">
    <div class="nav-header-row">
      <button class="active" onclick="switchTab('daily', this)">每日作業狀態</button>
      <button onclick="switchTab('cumulative', this)">未完成統計與核銷</button>
      <button onclick="switchTab('print', this)">列印欠繳清單</button>
      
      <div class="nav-divider"></div>
      
      <button onclick="openCategoryModal()">分類項目設定</button>
      <button onclick="openStudentModal()">管理學生名單與分組</button>
      <button class="btn-primary" onclick="openTaskModal()">+ 新增作業欄位</button>
      <button class="btn-sync" onclick="syncCloud()">雲端同步 (GAS)</button>
      <button class="btn-reset" onclick="resetAllData()">一鍵重置資料</button>
    </div>
  </header>

  <!-- 1. 每日作業狀態 -->
  <main id="daily-view" class="tab-content active no-print">
    <div class="task-board" id="task-board"></div>
  </main>

  <!-- 2. 未完成統計與核銷 -->
  <main id="cumulative-view" class="tab-content no-print">
    <div class="cumulative-controls">
      <div class="cumulative-filter-row">
        <div class="filter-group">
          <label>快速選取單項作業：</label>
          <select id="task-filter-select" onchange="filterByTask(this.value)">
            <option value="ALL">顯示全部作業項目</option>
          </select>
          <label style="margin-left: 10px; cursor: pointer; font-weight: normal; font-size: 0.88rem; display: flex; align-items: center; gap: 4px;">
            <input type="checkbox" id="show-done-chk" onchange="toggleShowDone(this.checked)"> 顯示已完成項目 (可用於誤按復原)
          </label>
        </div>
        <button style="padding:6px 12px; background:#fdf2f2; color:var(--color-red); border:1px solid #f5babb; border-radius:6px; cursor:pointer; font-weight:600;" onclick="openManageTasksModal()">🗑️ 管理/刪除歷史任務</button>
      </div>
      <div class="student-tags-bar" id="student-tags"></div>
    </div>

    <table class="data-table">
      <thead>
        <tr>
          <th>學生姓名</th>
          <th>作業日期</th>
          <th>科目分類</th>
          <th>作業名稱</th>
          <th>目前狀態</th>
          <th>核銷與狀態變更</th>
        </tr>
      </thead>
      <tbody id="cumulative-list"></tbody>
    </table>
  </main>

  <!-- 3. 列印設定頁面 -->
  <main id="print-view" class="tab-content no-print">
    <div class="print-selector">
      <h3>選擇欲列印欠繳清單的學生：</h3>
      <div style="margin-top: 10px;">
        <button onclick="selectAllPrint(true)" style="padding:4px 10px; border-radius:6px; cursor:pointer;">全選</button>
        <button onclick="selectAllPrint(false)" style="padding:4px 10px; border-radius:6px; cursor:pointer;">取消全選</button>
        <button class="btn-print" style="margin-left: 15px; padding:6px 14px; border-radius:6px; cursor:pointer; font-weight:600;" onclick="triggerPrint()">開啟 A4 預覽與列印 (每頁4格)</button>
      </div>
      <div class="checkbox-grid" id="print-checkboxes"></div>
    </div>
  </main>

  <!-- A4 列印區 -->
  <div class="print-only" id="print-container"></div>

  <!-- 新增任務 Modal -->
  <div class="modal" id="task-modal">
    <div class="modal-content">
      <h3>新增作業任務</h3>
      <div class="form-group" style="margin-top:12px;">
        <label>作業日期：</label>
        <input type="date" id="task-date-input">
      </div>
      <div class="form-group">
        <label>選擇預設科目分類：</label>
        <select id="task-category-select"></select>
      </div>
      <div class="form-group">
        <label>指定對象/分組：</label>
        <select id="task-target-group-select">
          <option value="ALL">全班學生</option>
        </select>
      </div>
      <div class="form-group">
        <label>輸入作業名稱：</label>
        <input type="text" id="task-name-input" placeholder="例如：加強組抽查作業 P.10">
      </div>
      <p style="font-size:0.8rem; color:var(--text-muted);">※ 若選擇指定分組，只有屬於該分組的學生會派發此作業。</p>
      <div class="modal-btns">
        <button onclick="closeTaskModal()">取消</button>
        <button style="background:var(--color-primary); color:white; border:none;" onclick="saveNewTask()">確認新增</button>
      </div>
    </div>
  </div>

  <!-- 管理/刪除歷史任務 Modal -->
  <div class="modal" id="manage-tasks-modal">
    <div class="modal-content">
      <h3>管理與刪除歷史作業任務</h3>
      <p style="font-size:0.85rem; color:var(--text-muted); margin-top:4px;">點擊刪除按鈕即可清理過去過期或無效的作業任務：</p>
      <hr style="margin: 12px 0; border:0; border-top:1px solid var(--border-color);">
      <table class="student-edit-table">
        <tbody id="manage-tasks-list"></tbody>
      </table>
      <div class="modal-btns">
        <button onclick="closeManageTasksModal()">關閉</button>
      </div>
    </div>
  </div>

  <!-- 科目分類管理 Modal -->
  <div class="modal" id="category-modal">
    <div class="modal-content">
      <h3>科目分類項目設定</h3>
      <div class="form-group" style="margin-top:10px;">
        <label>新增科目分類：</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="new-category-input" placeholder="例如：本土語、藝術">
          <button style="padding:6px 12px; background:var(--color-primary); color:white; border:none; border-radius:8px; cursor:pointer;" onclick="addCategory()">新增</button>
        </div>
      </div>
      <hr style="margin: 15px 0; border:0; border-top:1px solid var(--border-color);">
      <h4>現有分類項目：</h4>
      <div id="category-list" style="margin-top:10px;"></div>
      <div class="modal-btns">
        <button onclick="closeCategoryModal()">完成</button>
      </div>
    </div>
  </div>

  <!-- 學生管理 Modal -->
  <div class="modal" id="student-modal">
    <div class="modal-content">
      <h3>學生名單與分組管理</h3>
      <div class="form-group" style="margin-top:10px;">
        <label>批量新增學生（每行一位）：</label>
        <textarea id="batch-student-input" style="height:65px;" placeholder="01 張小明&#10;02 李小華"></textarea>
        <button style="margin-top:6px; padding:6px 12px; background:#f4f8fa; border:1px solid var(--border-color); border-radius:6px; cursor:pointer;" onclick="saveBatchStudents()">批量加入名單</button>
      </div>
      <hr style="margin: 15px 0; border:0; border-top:1px solid var(--border-color);">
      <h4>現有名單與分組標籤：</h4>
      <p style="font-size:0.78rem; color:var(--text-muted); margin-bottom:8px;">※ 可以在右側欄位替學生設定分組標籤（多個分組可用逗號分隔，例如：`A組, 抽離組`）</p>
      <table class="student-edit-table">
        <thead>
          <tr>
            <th style="width:45%;">學生姓名</th>
            <th style="width:45%;">分組標籤 (如: A組)</th>
            <th style="width:10%;">操作</th>
          </tr>
        </thead>
        <tbody id="student-edit-list"></tbody>
      </table>
      <div class="modal-btns">
        <button onclick="closeStudentModal()">關閉</button>
      </div>
    </div>
  </main>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzPne0zJciyGcaaaUsb2QYsyvxyaJEBUQpCzqNX4hvXL6rMtjEijtFGSY8DaSV4_BmqvA/exec";

    function getTodayString() {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    const defaultState = {
      categories: ["國語", "數學", "英文", "社會", "自然", "綜合"],
      students: [
        { name: "01 張小明", groups: ["A組"] },
        { name: "02 李小華", groups: ["B組", "加強組"] },
        { name: "03 王大同", groups: ["A組"] },
        { name: "04 陳美麗", groups: ["B組"] },
        { name: "05 林阿強", groups: ["加強組"] }
      ],
      tasks: [
        { id: 1, date: getTodayString(), category: "國語", targetGroup: "ALL", name: "國語習作 L3" },
        { id: 2, date: getTodayString(), category: "數學", targetGroup: "加強組", name: "數學習作 P.15" }
      ],
      records: {
        "01 張小明_1": "unsubmitted",
        "02 李小華_1": "unsubmitted",
        "02 李小華_2": "correcting",
        "05 林阿強_2": "unsubmitted"
      }
    };

    let state = JSON.parse(JSON.stringify(defaultState));
    let selectedStudentFilter = 'ALL';
    let selectedTaskFilter = 'ALL';
    let showDoneItems = false;

    function init() {
      const saved = localStorage.getItem("tracker_data_v6");
      if (saved) {
        try {
          state = JSON.parse(saved);
          if (state.students && state.students.length > 0 && typeof state.students[0] === 'string') {
            state.students = state.students.map(s => ({ name: s, groups: [] }));
          }
        } catch (e) {
          state = JSON.parse(JSON.stringify(defaultState));
        }
      }
      sortStudentsByNumber();
      renderDailyBoard();
      renderTaskFilterOptions();
      renderStudentTags();
      renderCumulative();
      renderPrintCheckboxes();
    }

    function saveData() {
      sortStudentsByNumber();
      localStorage.setItem("tracker_data_v6", JSON.stringify(state));
      if (!GAS_WEB_APP_URL.includes("YOUR_GOOGLE")) {
        fetch(GAS_WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(state) });
      }
    }

    function sortStudentsByNumber() {
      if (state.students && state.students.length > 0) {
        state.students.sort((a, b) => {
          const nameA = typeof a === 'string' ? a : a.name;
          const nameB = typeof b === 'string' ? b : b.name;
          const matchA = nameA.match(/\d+/);
          const matchB = nameB.match(/\d+/);
          const numA = matchA ? parseInt(matchA[0], 10) : Infinity;
          const numB = matchB ? parseInt(matchB[0], 10) : Infinity;

          if (numA !== numB) {
            return numA - numB;
          }
          return nameA.localeCompare(nameB, 'zh-Hant');
        });
      }
    }

    function getAllGroupTags() {
      const groupSet = new Set();
      state.students.forEach(s => {
        if (s.groups && Array.isArray(s.groups)) {
          s.groups.forEach(g => groupSet.add(g.trim()));
        }
      });
      return Array.from(groupSet).filter(g => g.length > 0);
    }

    function isStudentAssignedToTask(studentObj, taskObj) {
      if (!taskObj.targetGroup || taskObj.targetGroup === 'ALL') return true;
      if (!studentObj.groups || !Array.isArray(studentObj.groups)) return false;
      return studentObj.groups.includes(taskObj.targetGroup);
    }

    function resetAllData() {
      const confirmFirst = confirm("警告：您確定要重置系統資料嗎？\n這將會【完全清空】所有任務、學生名單與紀錄，方便新班級使用。");
      if (confirmFirst) {
        const confirmSecond = confirm("請再次確認：所有學生與任務資料將被完全刪除且無法復原！是否繼續？");
        if (confirmSecond) {
          state = {
            categories: state.categories && state.categories.length > 0 ? state.categories : ["國語", "數學", "英文", "社會", "自然", "綜合"],
            students: [],
            tasks: [],
            records: {}
          };
          saveData();
          init();
          alert("所有任務與學生名單已成功清空！");
        }
      }
    }

    function switchTab(tab, btnElem) {
      document.querySelectorAll('.nav-header-row button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      if(btnElem) btnElem.classList.add('active');
      
      if (tab === 'daily') {
        document.getElementById('daily-view').classList.add('active');
        renderDailyBoard();
      } else if (tab === 'cumulative') {
        document.getElementById('cumulative-view').classList.add('active');
        renderTaskFilterOptions();
        renderStudentTags();
        renderCumulative();
      } else if (tab === 'print') {
        document.getElementById('print-view').classList.add('active');
        renderPrintCheckboxes();
      }
    }

    function renderDailyBoard() {
      const board = document.getElementById('task-board');
      board.innerHTML = '';

      const todayStr = getTodayString();
      const todayTasks = state.tasks.filter(t => t.date === todayStr);

      if (todayTasks.length === 0) {
        board.innerHTML = `
          <div class="empty-state-box">
            <h3>今日 (${todayStr}) 尚無作業任務</h3>
            <p style="margin-top:8px;">請點擊上方「+ 新增作業欄位」建立今日作業。<br>過往未完成的作業可至「未完成統計與核銷」或「列印欠繳清單」查看與核銷。</p>
          </div>`;
        return;
      }

      todayTasks.forEach(task => {
        const targetGroupText = (task.targetGroup && task.targetGroup !== 'ALL') ? `<span class="task-target-tag">🎯 ${task.targetGroup}</span>` : '';

        let colHtml = `
          <div class="task-column">
            <button class="btn-delete-task" title="刪除此任務" onclick="deleteTask(${task.id})">&times;</button>
            <div class="task-header">
              <div class="task-meta">
                <span class="task-category-tag">${task.category}</span>
                ${targetGroupText}
                <span class="task-date-tag">📅 ${task.date}</span>
              </div>
              <div class="task-title-container">
                <div class="task-title" id="task-title-${task.id}">${task.name}</div>
                <button class="btn-edit-title" title="修改作業名稱" onclick="editTaskName(${task.id})">✏️</button>
              </div>
            </div>
            <div class="student-grid-2col">`;

        if (state.students.length === 0) {
          colHtml += `<div style="grid-column: span 2; text-align:center; color:var(--text-muted); padding:10px; font-size:0.85rem;">尚未建立學生名單</div>`;
        } else {
          state.students.forEach(studentObj => {
            const studentName = studentObj.name;
            const isAssigned = isStudentAssignedToTask(studentObj, task);

            if (!isAssigned) {
              colHtml += `
                <div class="student-block status-na" title="非指定分組作業">
                  <span class="student-name-text">${studentName}</span>
                  <span class="status-sub">免</span>
                </div>`;
            } else {
              const key = `${studentName}_${task.id}`;
              const status = state.records[key] || 'unsubmitted';
              
              let statusClass = 'status-unsubmitted';
              let statusText = '未';
              if (status === 'correcting') { statusClass = 'status-correcting'; statusText = '訂'; }
              else if (status === 'done') { statusClass = 'status-done'; statusText = '完'; }

              colHtml += `
                <div class="student-block ${statusClass}" onclick="cycleStatus('${studentName}', ${task.id})">
                  <span class="student-name-text">${studentName}</span>
                  <span class="status-sub">${statusText}</span>
                </div>`;
            }
          });
        }

        colHtml += `</div></div>`;
        board.innerHTML += colHtml;
      });
    }

    function editTaskName(taskId) {
      const task = state.tasks.find(t => t.id === taskId);
      if (!task) return;
      
      const newName = prompt("請輸入新的作業名稱：", task.name);
      if (newName !== null) {
        const trimmed = newName.trim();
        if (trimmed) {
          task.name = trimmed;
          saveData();
          renderDailyBoard();
          renderCumulative();
        } else {
          alert("作業名稱不能為空！");
        }
      }
    }

    function cycleStatus(studentName, taskId) {
      const key = `${studentName}_${taskId}`;
      const current = state.records[key] || 'unsubmitted';
      
      if (current === 'unsubmitted') state.records[key] = 'correcting';
      else if (current === 'correcting') state.records[key] = 'done';
      else if (current === 'done') state.records[key] = 'unsubmitted';

      saveData();
      renderDailyBoard();
    }

    function renderTaskFilterOptions() {
      const select = document.getElementById('task-filter-select');
      select.innerHTML = '<option value="ALL">顯示全部作業項目</option>';
      state.tasks.forEach(task => {
        const selected = selectedTaskFilter == task.id ? 'selected' : '';
        const groupInfo = (task.targetGroup && task.targetGroup !== 'ALL') ? ` (${task.targetGroup})` : '';
        select.innerHTML += `<option value="${task.id}" ${selected}>[${task.date}] ${task.category} - ${task.name}${groupInfo}</option>`;
      });
    }

    function filterByTask(taskId) {
      selectedTaskFilter = taskId;
      renderCumulative();
    }

    function toggleShowDone(checked) {
      showDoneItems = checked;
      renderCumulative();
    }

    function renderStudentTags() {
      const container = document.getElementById('student-tags');
      container.innerHTML = `<button class="tag-btn ${selectedStudentFilter==='ALL'?'active':''}" onclick="filterByStudent('ALL')">全部學生</button>`;
      state.students.forEach(s => {
        const studentName = s.name;
        const active = selectedStudentFilter === studentName ? 'active' : '';
        container.innerHTML += `<button class="tag-btn ${active}" onclick="filterByStudent('${studentName}')">${studentName}</button>`;
      });
    }

    function filterByStudent(studentName) {
      selectedStudentFilter = studentName;
      renderStudentTags();
      renderCumulative();
    }

    function renderCumulative() {
      const list = document.getElementById('cumulative-list');
      list.innerHTML = '';

      if (state.students.length === 0 || state.tasks.length === 0) {
        list.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--text-muted); padding:20px;">尚無學生或任務資料</td></tr>`;
        return;
      }

      let count = 0;
      state.students.forEach(studentObj => {
        const studentName = studentObj.name;
        if (selectedStudentFilter !== 'ALL' && selectedStudentFilter !== studentName) return;

        state.tasks.forEach(task => {
          if (selectedTaskFilter !== 'ALL' && selectedTaskFilter != task.id) return;
          if (!isStudentAssignedToTask(studentObj, task)) return;

          const key = `${studentName}_${task.id}`;
          const status = state.records[key] || 'unsubmitted';

          if (status === 'unsubmitted' || status === 'correcting' || (showDoneItems && status === 'done')) {
            count++;
            let statusText = '';
            let actionButtons = '';

            if (status === 'unsubmitted') {
              statusText = '<span style="color:var(--color-orange);font-weight:700;">未繳</span>';
              actionButtons = `
                <button class="btn-correct" onclick="setTaskStatus('${studentName}', ${task.id}, 'correcting')">標記(訂正)</button>
                <button class="btn-verify" onclick="setTaskStatus('${studentName}', ${task.id}, 'done')">核銷(完成)</button>`;
            } else if (status === 'correcting') {
              statusText = '<span style="color:#8a4321;font-weight:700;">訂正</span>';
              actionButtons = `
                <button class="btn-revert-unsub" onclick="setTaskStatus('${studentName}', ${task.id}, 'unsubmitted')">復原(未繳)</button>
                <button class="btn-verify" onclick="setTaskStatus('${studentName}', ${task.id}, 'done')">核銷(完成)</button>`;
            } else if (status === 'done') {
              statusText = '<span style="color:var(--color-primary);font-weight:700;">已完成</span>';
              actionButtons = `
                <button class="btn-revert-unsub" onclick="setTaskStatus('${studentName}', ${task.id}, 'unsubmitted')">復原(未繳)</button>
                <button class="btn-correct" onclick="setTaskStatus('${studentName}', ${task.id}, 'correcting')">復原(訂正)</button>`;
            }

            const targetGroupTag = (task.targetGroup && task.targetGroup !== 'ALL') ? `<span class="task-target-tag" style="margin-left:4px;">🎯 ${task.targetGroup}</span>` : '';

            list.innerHTML += `
              <tr>
                <td><b>${studentName}</b></td>
                <td>${task.date || '-'}</td>
                <td>${task.category}</td>
                <td>${task.name} ${targetGroupTag}</td>
                <td>${statusText}</td>
                <td><div class="btn-action-group">${actionButtons}</div></td>
              </tr>`;
          }
        });
      });

      if (count === 0) {
        list.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--color-primary); padding:20px; font-weight:600;">🎉 所選條件下目前沒有需處理的作業項目！</td></tr>`;
      }
    }

    function setTaskStatus(studentName, taskId, newStatus) {
      state.records[`${studentName}_${taskId}`] = newStatus;
      saveData();
      renderCumulative();
      renderDailyBoard();
    }

    function openManageTasksModal() {
      renderManageTasksList();
      document.getElementById('manage-tasks-modal').style.display = 'flex';
    }

    function closeManageTasksModal() {
      document.getElementById('manage-tasks-modal').style.display = 'none';
      renderTaskFilterOptions();
      renderCumulative();
      renderDailyBoard();
    }

    function renderManageTasksList() {
      const tbody = document.getElementById('manage-tasks-list');
      tbody.innerHTML = '';
      if (state.tasks.length === 0) {
        tbody.innerHTML = `<tr><td style="text-align:center; color:var(--text-muted); padding:10px;">目前尚無任何任務項目</td></tr>`;
        return;
      }
      state.tasks.forEach(task => {
        const groupInfo = (task.targetGroup && task.targetGroup !== 'ALL') ? ` [對象:${task.targetGroup}]` : '';
        tbody.innerHTML += `
          <tr>
            <td>
              <b>[${task.date}] ${task.category}</b> - ${task.name} <span style="color:var(--text-muted); font-size:0.8rem;">${groupInfo}</span>
            </td>
            <td style="width:70px; text-align:right;">
              <button style="color:var(--color-red); border:1px solid #f5babb; background:#fdf2f2; padding:4px 8px; border-radius:6px; cursor:pointer;" onclick="deleteTaskInModal(${task.id})">刪除</button>
            </td>
          </tr>`;
      });
    }

    function deleteTaskInModal(taskId) {
      if (confirm("確定要徹底刪除此項作業任務及其所有紀錄嗎？")) {
        deleteTask(taskId);
        renderManageTasksList();
      }
    }

    function deleteTask(taskId) {
      state.tasks = state.tasks.filter(t => t.id !== taskId);
      for (let key in state.records) {
        if (key.endsWith(`_${taskId}`)) delete state.records[key];
      }
      saveData();
      renderDailyBoard();
    }

    function openCategoryModal() {
      renderCategoryList();
      document.getElementById('category-modal').style.display = 'flex';
    }

    function closeCategoryModal() {
      document.getElementById('category-modal').style.display = 'none';
    }

    function renderCategoryList() {
      const list = document.getElementById('category-list');
      list.innerHTML = '';
      state.categories.forEach((cat, index) => {
        list.innerHTML += `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <input type="text" value="${cat}" style="width:70%; padding:6px;" onchange="updateCategory(${index}, this.value)">
            <button style="color:var(--color-red); border:none; background:none; cursor:pointer;" onclick="deleteCategory(${index})">刪除</button>
          </div>`;
      });
    }

    function addCategory() {
      const input = document.getElementById('new-category-input');
      const val = input.value.trim();
      if (val && !state.categories.includes(val)) {
        state.categories.push(val);
        input.value = '';
        saveData();
        renderCategoryList();
      }
    }

    function updateCategory(index, newVal) {
      newVal = newVal.trim();
      if (newVal) {
        state.categories[index] = newVal;
        saveData();
      }
    }

    function deleteCategory(index) {
      if (confirm(`確定要刪除「${state.categories[index]}」分類嗎？`)) {
        state.categories.splice(index, 1);
        saveData();
        renderCategoryList();
      }
    }

    function openTaskModal() {
      if (!state.categories || state.categories.length === 0) {
        alert("請先至少建立一個科目分類！");
        openCategoryModal();
        return;
      }
      
      document.getElementById('task-date-input').value = getTodayString();

      const catSelect = document.getElementById('task-category-select');
      catSelect.innerHTML = '';
      state.categories.forEach(cat => {
        catSelect.innerHTML += `<option value="${cat}">${cat}</option>`;
      });

      const groupSelect = document.getElementById('task-target-group-select');
      groupSelect.innerHTML = '<option value="ALL">全班學生</option>';
      const allGroups = getAllGroupTags();
      allGroups.forEach(g => {
        groupSelect.innerHTML += `<option value="${g}">指定 [${g}] 學生</option>`;
      });

      document.getElementById('task-name-input').value = '';
      document.getElementById('task-modal').style.display = 'flex';
    }

    function closeTaskModal() {
      document.getElementById('task-modal').style.display = 'none';
    }

    function saveNewTask() {
      const date = document.getElementById('task-date-input').value || getTodayString();
      const category = document.getElementById('task-category-select').value;
      const targetGroup = document.getElementById('task-target-group-select').value;
      const name = document.getElementById('task-name-input').value.trim();
      if (!name) return alert("請輸入作業名稱！");

      const newTaskId = Date.now();
      state.tasks.push({ id: newTaskId, date, category, targetGroup, name });

      state.students.forEach(s => {
        if (isStudentAssignedToTask(s, { targetGroup })) {
          state.records[`${s.name}_${newTaskId}`] = 'unsubmitted';
        }
      });

      saveData();
      closeTaskModal();
      renderDailyBoard();
    }

    function renderPrintCheckboxes() {
      const container = document.getElementById('print-checkboxes');
      container.innerHTML = '';
      if (state.students.length === 0) {
        container.innerHTML = `<p style="color:var(--text-muted);">尚無學生名單可供選擇。</p>`;
        return;
      }
      state.students.forEach(s => {
        container.innerHTML += `<label><input type="checkbox" class="print-chk" value="${s.name}" checked> ${s.name}</label>`;
      });
    }

    function selectAllPrint(select) {
      document.querySelectorAll('.print-chk').forEach(chk => chk.checked = select);
    }

    function triggerPrint() {
      const selectedStudents = Array.from(document.querySelectorAll('.print-chk:checked')).map(cb => cb.value);
      if (selectedStudents.length === 0) return alert("請至少選取一位學生！");

      const printContainer = document.getElementById('print-container');
      printContainer.innerHTML = '';

      const ITEMS_PER_CARD = 8;
      const allCards = [];

      selectedStudents.forEach(studentName => {
        const studentObj = state.students.find(s => s.name === studentName) || { name: studentName, groups: [] };
        const items = [];

        state.tasks.forEach(task => {
          if (!isStudentAssignedToTask(studentObj, task)) return;

          const status = state.records[`${studentName}_${task.id}`] || 'unsubmitted';
          if (status === 'unsubmitted' || status === 'correcting') {
            items.push({
              category: task.category,
              name: task.name,
              date: task.date,
              status: status
            });
          }
        });

        if (items.length === 0) {
          allCards.push({
            student: studentName,
            pageLabel: '',
            contentHtml: `<p style="margin-top:15px; color:green; font-size:1.2rem; font-weight:bold;">目前作業全數完成！</p>`
          });
        } else {
          const totalChunks = Math.ceil(items.length / ITEMS_PER_CARD);

          for (let c = 0; c < totalChunks; c++) {
            const chunkItems = items.slice(c * ITEMS_PER_CARD, (c + 1) * ITEMS_PER_CARD);
            const pageLabel = totalChunks > 1 ? ` (${c + 1}/${totalChunks})` : '';

            const catMap = {};
            chunkItems.forEach(item => {
              if (!catMap[item.category]) catMap[item.category] = [];
              catMap[item.category].push(item);
            });

            let cardContentHtml = '';
            for (let cat in catMap) {
              cardContentHtml += `<div class="print-cat">${cat}</div><ul class="print-list">`;
              catMap[cat].forEach(item => {
                const tag = item.status === 'unsubmitted' ? '<span class="status-tag-print" style="color:#F37748;">(未繳)</span>' : '<span class="status-tag-print" style="color:#8a4321;">(訂正)</span>';
                const dateStr = item.date ? `[${item.date}] ` : '';
                cardContentHtml += `<li>${dateStr}${item.name} ${tag}</li>`;
              });
              cardContentHtml += `</ul>`;
            }

            allCards.push({
              student: studentName,
              pageLabel: pageLabel,
              contentHtml: cardContentHtml
            });
          }
        }
      });

      let fullPagesHtml = '';
      for (let i = 0; i < allCards.length; i += 4) {
        const pageCards = allCards.slice(i, i + 4);
        let pageCardsHtml = '';

        pageCards.forEach(card => {
          pageCardsHtml += `
            <div class="print-card">
              <h3>${card.student}${card.pageLabel} - 欠繳與訂正清單</h3>
              ${card.contentHtml}
            </div>`;
        });

        fullPagesHtml += `<div class="print-page">${pageCardsHtml}</div>`;
      }

      printContainer.innerHTML = fullPagesHtml;
      
      setTimeout(() => {
        window.print();
      }, 100);
    }

    function openStudentModal() {
      renderStudentEditList();
      document.getElementById('student-modal').style.display = 'flex';
    }

    function closeStudentModal() {
      document.getElementById('student-modal').style.display = 'none';
      renderDailyBoard();
    }

    function saveBatchStudents() {
      const raw = document.getElementById('batch-student-input').value;
      if (!raw.trim()) return;
      
      const newNames = raw.split(/[\n,，]/).map(s => s.trim()).filter(s => s.length > 0);
      newNames.forEach(name => {
        if (!state.students.some(s => s.name === name)) {
          state.students.push({ name: name, groups: [] });
        }
      });

      document.getElementById('batch-student-input').value = '';
      saveData();
      renderStudentEditList();
    }

    function renderStudentEditList() {
      const tbody = document.getElementById('student-edit-list');
      tbody.innerHTML = '';
      if (state.students.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--text-muted); padding:10px;">目前無學生名單</td></tr>`;
        return;
      }
      state.students.forEach((s, index) => {
        const groupStr = (s.groups && Array.isArray(s.groups)) ? s.groups.join(', ') : '';
        tbody.innerHTML += `
          <tr>
            <td><input type="text" value="${s.name}" style="padding:6px; border-radius:6px; border:1px solid var(--border-color); width:95%;" onchange="updateStudentName(${index}, this.value)"></td>
            <td><input type="text" value="${groupStr}" placeholder="如: A組, 加強組" style="padding:6px; border-radius:6px; border:1px solid var(--border-color); width:95%;" onchange="updateStudentGroups(${index}, this.value)"></td>
            <td style="text-align:center;"><button style="color:var(--color-red); border:none; background:none; cursor:pointer;" onclick="deleteStudent(${index})">刪除</button></td>
          </tr>`;
      });
    }

    function updateStudentName(index, newName) {
      newName = newName.trim();
      const oldName = state.students[index].name;
      if (!newName || newName === oldName) return;

      state.students[index].name = newName;
      for (let key in state.records) {
        if (key.startsWith(`${oldName}_`)) {
          const taskId = key.split('_')[1];
          state.records[`${newName}_${taskId}`] = state.records[key];
          delete state.records[key];
        }
      }
      saveData();
      renderStudentEditList();
    }

    function updateStudentGroups(index, rawGroups) {
      const groups = rawGroups.split(/[,，]/).map(g => g.trim()).filter(g => g.length > 0);
      state.students[index].groups = groups;
      saveData();
    }

    function deleteStudent(index) {
      if (confirm(`確定刪除「${state.students[index].name}」嗎？`)) {
        state.students.splice(index, 1);
        saveData();
        renderStudentEditList();
      }
    }

    function syncCloud() {
      if (GAS_WEB_APP_URL.includes("YOUR_GOOGLE")) return alert("請先將程式碼中的 GAS_WEB_APP_URL 替換為你的 Web App URL！");
      fetch(GAS_WEB_APP_URL)
        .then(res => res.json())
        .then(remote => {
          state = remote;
          saveData();
          init();
          alert("雲端同步完成！");
        });
    }

    init();
  </script>
</body>
</html>
